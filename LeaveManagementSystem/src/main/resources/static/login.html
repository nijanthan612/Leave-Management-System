<!DOCTYPE html>
<html>
<head>
    <title>Employee Login</title>
	<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container login-container">
    <h2>Leave Request Portal</h2>

    <div class="form-group">
        <label for="name">Username</label>
        <input type="text" id="name" placeholder="Enter your username">
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
    </div>

    <button class="primary-btn full-width-btn" onclick="login()">Sign In</button>

    <p id="msg" class="message-status"></p>

    <div class="link-footer">
        New to the system? <a href="register.html">Register an account</a>
    </div>
</div>

<script>
// (Keep the existing JavaScript logic here)
function login() {
    const msg = document.getElementById("msg");
    
    fetch('/employee/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: document.getElementById("name").value,
            password: document.getElementById("password").value
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data && data.id) {
            localStorage.setItem("empId", data.id);
            localStorage.setItem("name", data.name);
            localStorage.setItem("project", data.projectName);
            localStorage.setItem("role", data.role);

            if (data.role === "Manager" || data.role === "HR") {
                window.location.href = "admin.html";
            } else {
                window.location.href = "index.html";
            }
        } else {
            msg.innerText = "Invalid username or password. Please try again.";
            msg.style.color = "red";
        }
    });
}
</script>

</body>
</html>
